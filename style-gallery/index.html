<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风格图鉴 · AI 提示词风格库</title>
<meta name="description" content="5 大类 38 种 AI 绘画风格参考图与提示词库：写实摄影、东方国风、二次元插画、创意潮流、3D 渲染，一键复制通用提示词，上传图片实时预览风格效果。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23F6F3EC' stroke='%23B79B62' stroke-width='3'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%232B2722' font-family='serif'%3E图%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<style>
/* ============ 设计变量 ============ */
:root{
  --paper:#F6F3EC;
  --paper-2:#EFEAE0;
  --card:#FCFAF5;
  --ink:#2B2722;
  --ink-2:#6E675D;
  --ink-3:#9A9284;
  --line:#E3DDD0;
  --sage:#7E9182;
  --sage-deep:#5F7366;
  --sage-soft:#DDE4DC;
  --gold:#B79B62;
  --gold-soft:#E8DCC2;
  --shadow:0 10px 30px rgba(43,39,34,.08);
  --radius:16px;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:4px}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* ============ 顶部导航 ============ */
.nav{position:sticky;top:0;z-index:100;background:rgba(246,243,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:1px}
.brand-mark{width:32px;height:32px;border:1.5px solid var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);background:var(--card)}
.nav-links{display:none;align-items:center;gap:6px}
.nav-link{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--ink-2);transition:.2s}
.nav-link:hover,.nav-link.on{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.dropdown{position:relative}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:50}
.dropdown.open .dd-menu{display:block}
.dd-item{display:block;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.dd-item:hover{background:var(--paper-2);color:var(--ink)}
.dd-item small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.burger{width:40px;height:40px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;border-radius:10px}
.burger span{width:20px;height:2px;background:var(--ink);border-radius:2px;transition:.25s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{display:none;border-top:1px solid var(--line);background:var(--card);padding:10px 20px 16px}
.mobile-menu.open{display:block}
.mm-link{display:block;padding:11px 8px;border-radius:10px;font-size:15px;color:var(--ink-2)}
.mm-link:hover{background:var(--paper-2);color:var(--ink)}
@media(min-width:768px){
  .nav-links{display:flex}
  .burger{display:none}
  .mobile-menu{display:none!important}
}

/* ============ 通用区块 ============ */
.page{padding:28px 0 70px;min-height:70vh}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--sage-deep);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--gold)}
h1.display{font-family:var(--serif);font-size:34px;line-height:1.35;font-weight:700;letter-spacing:1px}
h2.section-title{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.section-sub{color:var(--ink-2);font-size:14px;margin-bottom:28px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
@media(min-width:768px){
  h1.display{font-size:46px}
  h2.section-title{font-size:32px}
  .page{padding:44px 0 90px}
}

/* ============ 首页 Hero ============ */
.hero{padding:52px 0 44px}
.hero-grid{display:grid;gap:36px;align-items:center}
.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0}
@media(min-width:768px){.hero-stats{display:flex;flex-wrap:wrap;gap:12px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:104px}
.stat b{font-family:var(--serif);font-size:24px;display:block;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-3)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:500;transition:.25s;border:1px solid transparent}
.btn-primary{background:var(--ink);color:#F8F5EE}
.btn-primary:hover{background:#3D372F;transform:translateY(-1px)}
.btn-ghost{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn-sage{background:var(--sage);color:#FBFAF6}
.btn-sage:hover{background:var(--sage-deep)}
.hero-visual{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,auto);gap:12px;position:relative}
.hero-visual img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;box-shadow:var(--shadow)}
.hero-visual img:nth-child(1){grid-row:span 3;aspect-ratio:3/4}
.hero-visual img:nth-child(2){aspect-ratio:16/10}
.hero-visual img:nth-child(3){aspect-ratio:16/10}
.hero-visual img:nth-child(4){aspect-ratio:16/10}
.hero-visual::after{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:18px;pointer-events:none;opacity:.45}
@media(min-width:768px){.hero-grid{grid-template-columns:1.05fr .95fr}}
@media(min-width:1024px){
  .hero{padding:76px 0 56px}
  h1.display{font-size:52px}
}

/* ============ 分类卡片 ============ */
.cat-grid{display:grid;gap:16px;grid-template-columns:repeat(1,1fr)}
@media(min-width:600px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.cat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.3s;display:block}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--gold-soft)}
.cat-card .cover{position:relative;aspect-ratio:16/10;overflow:hidden}
.cat-card .cover img{width:100%;height:100%;object-fit:cover;transition:.5s}
.cat-card:hover .cover img{transform:scale(1.05)}
.cat-card .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(43,39,34,.55))}
.cat-card .cover b{position:absolute;left:16px;bottom:12px;z-index:2;color:#F8F5EE;font-family:var(--serif);font-size:21px;letter-spacing:1px}
.cat-card .cover em{position:absolute;right:14px;top:12px;z-index:2;font-style:normal;font-size:12px;color:#F8F5EE;background:rgba(43,39,34,.4);padding:3px 10px;border-radius:999px;letter-spacing:1px}
.cat-card .body{padding:16px 18px 18px}
.cat-card .tagline{font-size:13px;color:var(--sage-deep);margin-bottom:6px;letter-spacing:1px}
.cat-card .desc{font-size:13px;color:var(--ink-2);margin-bottom:12px;min-height:38px}
.cat-card .meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.cat-card .go{color:var(--sage-deep);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.cat-card:hover .go{gap:8px;color:var(--sage-deep)}
/* 5 个卡片 3列布局修正：最后一行2个，OK；2列时3行中最后1行1个 */
@media(min-width:600px) and (max-width:999px){
  .cat-card:last-child:nth-child(odd){grid-column:span 2;max-width:50%}
}

/* ============ 风格墙 ============ */
.gallery-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2);transition:.2s}
.chip:hover{border-color:var(--sage);color:var(--sage-deep)}
.chip.on{background:var(--ink);color:#F8F5EE;border-color:var(--ink)}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 16px 9px 40px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.style-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.style-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.style-grid{grid-template-columns:repeat(4,1fr)}}
.style-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.3s;display:flex;flex-direction:column}
.style-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--gold-soft)}
.style-card .thumb{position:relative;aspect-ratio:3/4;overflow:hidden}
.style-card .thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:.5s}
.style-card:hover .thumb img{transform:scale(1.04)}
.style-card .type-tag{position:absolute;left:10px;top:10px;z-index:2;font-size:11px;background:rgba(252,250,245,.92);color:var(--sage-deep);padding:3px 9px;border-radius:999px;letter-spacing:1px}
.style-card .body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.style-card h3{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.5px}
.style-card .tags{display:flex;flex-wrap:wrap;gap:5px}
.style-card .tags span{font-size:11px;color:var(--ink-3);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.style-card .actions{display:flex;gap:8px;margin-top:auto}
.mini-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 8px;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);transition:.2s}
.mini-btn:hover{border-color:var(--sage);color:var(--sage-deep);background:var(--card)}
.mini-btn.solid{background:var(--ink);color:#F8F5EE;border-color:var(--ink)}
.mini-btn.solid:hover{background:#3D372F}
.empty-tip{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px}

/* ============ 使用指南 ============ */
.steps{display:grid;gap:16px;grid-template-columns:repeat(1,1fr)}
@media(min-width:768px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;position:relative}
.step .no{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:2px;margin-bottom:12px}
.step h3{font-family:var(--serif);font-size:18px;margin-bottom:8px}
.step p{font-size:13.5px;color:var(--ink-2)}

/* ============ CTA 条 ============ */
.cta-band{background:var(--ink);color:#F8F5EE;border-radius:20px;padding:38px 26px;text-align:center;position:relative;overflow:hidden}
.cta-band h2{font-family:var(--serif);font-size:24px;margin-bottom:10px;letter-spacing:1px}
.cta-band p{color:#C9C2B4;font-size:14px;margin-bottom:22px}
.cta-band .btn-primary{background:#F8F5EE;color:var(--ink)}
.cta-band .btn-primary:hover{background:#fff}
.cta-band::before{content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(184,155,98,.35)}
.cta-band::after{content:"";position:absolute;bottom:-80px;left:-40px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(126,145,130,.3)}
@media(min-width:768px){.cta-band{padding:54px 40px}.cta-band h2{font-size:30px}}

/* ============ 类别页 ============ */
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);margin-bottom:22px;flex-wrap:wrap}
.breadcrumb a:hover{color:var(--sage-deep)}
.cat-hero{margin-bottom:30px}
.cat-hero h1{font-family:var(--serif);font-size:32px;margin-bottom:8px}
.cat-hero .tagline{color:var(--sage-deep);font-size:14px;letter-spacing:1px;margin-bottom:8px}
.cat-hero .desc{color:var(--ink-2);font-size:14px;max-width:720px}
.cat-hero .stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cat-hero .stat-row span{font-size:12px;color:var(--ink-3);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px}

/* ============ 风格详情页 ============ */
.detail-grid{display:grid;gap:26px}
@media(min-width:900px){.detail-grid{grid-template-columns:.92fr 1.08fr;gap:40px}}
.detail-img-wrap{position:sticky;top:80px;align-self:start}
.detail-img{width:100%;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.detail-img-cap{font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px;letter-spacing:1px}
.detail-head h1{font-family:var(--serif);font-size:28px;margin-bottom:10px}
.detail-head .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.detail-head .tags span{font-size:12px;color:var(--sage-deep);background:var(--sage-soft);padding:3px 12px;border-radius:999px}
.detail-desc{color:var(--ink-2);font-size:14px;margin-bottom:22px}
.prompt-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.prompt-block .p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.prompt-block .p-title{font-family:var(--serif);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.prompt-block .p-title .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.prompt-block .p-note{font-size:12px;color:var(--ink-3)}
.prompt-block .p-text{font-size:13.5px;color:var(--ink);line-height:1.9;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.prompt-block .p-text .ph{background:var(--gold-soft);border-radius:4px;padding:0 3px;font-weight:600;color:#5A4A22}
.copy-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sage-deep);border:1px solid var(--line);padding:7px 14px;border-radius:999px;background:var(--paper);transition:.2s}
.copy-btn:hover{background:var(--sage-soft);border-color:var(--sage)}
.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.related-title{font-family:var(--serif);font-size:20px;margin:44px 0 16px;letter-spacing:1px}
.related-scroll{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.related-scroll{grid-template-columns:repeat(4,1fr)}}
.rel-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s}
.rel-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.rel-card img{aspect-ratio:3/4;object-fit:cover;object-position:center top;width:100%}
.rel-card .rel-name{padding:10px 12px;font-size:13px;font-weight:600;font-family:var(--serif)}
.rel-card .rel-type{font-size:11px;color:var(--ink-3);padding:0 12px 10px}

/* ============ 上传工作台 ============ */
.studio-wrap{max-width:1060px}
.drop-zone{border:1.5px dashed var(--gold);border-radius:18px;background:var(--card);padding:40px 20px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.drop-zone:hover,.drop-zone.drag{background:var(--sage-soft);border-color:var(--sage)}
.drop-zone .dz-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--sage-deep)}
.drop-zone p{font-size:14px;color:var(--ink-2)}
.drop-zone small{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-top:16px}
.preview-box{position:relative;width:200px}
.preview-box img{width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.preview-box .del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(43,39,34,.65);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.preview-box .del:hover{background:rgba(43,39,34,.9)}
.form-grid{display:grid;gap:14px;margin-top:20px}
@media(min-width:768px){.form-grid{grid-template-columns:1fr 1fr}}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.field label{display:block;font-family:var(--serif);font-weight:700;font-size:14px;margin-bottom:8px;letter-spacing:.5px}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.6}
.mode-options{display:flex;flex-direction:column;gap:8px}
@media(min-width:768px){.mode-options{flex-direction:row}}
.mode-opt{flex:1;display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.2s;background:var(--paper)}
.mode-opt:hover{border-color:var(--sage)}
.mode-opt.on{border-color:var(--sage);background:var(--sage-soft)}
.mode-opt input{margin-top:4px;accent-color:var(--sage)}
.mode-opt b{font-size:14px;display:block}
.mode-opt small{font-size:12px;color:var(--ink-2)}
select.style-select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.subject{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical;min-height:64px}
.studio-run{margin:22px 0 6px;width:100%;justify-content:center;padding:15px;font-size:16px}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
.result-head h3{font-family:var(--serif);font-size:20px}
.result-head small{color:var(--ink-3);font-size:12px}
.result-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.result-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.result-grid{grid-template-columns:repeat(4,1fr)}}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.result-card:hover{border-color:var(--gold-soft);box-shadow:var(--shadow)}
.result-card canvas{width:100%;aspect-ratio:3/4;display:block;object-fit:cover}
.result-card .r-body{padding:12px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.result-card h4{font-family:var(--serif);font-size:14.5px;font-weight:700}
.result-card .r-type{font-size:11px;color:var(--ink-3)}
.result-card .r-prompt{font-size:11.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:76px;overflow:hidden;position:relative;line-height:1.7}
.result-card .r-prompt.more{max-height:none}
.result-card .r-prompt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,transparent,var(--paper))}
.result-card .r-prompt.more::after{display:none}
.result-card .r-actions{display:flex;gap:7px;margin-top:auto}

/* ============ 工具函数 ============ */
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function catOf(id){return CATS.find(function(c){return c.id===id})}
function styleOf(id){return STYLES.find(function(s){return s.id===id})}
function stylesOfCat(id){return STYLES.filter(function(s){return s.cat===id})}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1800)}
function copyText(text){
  var done=function(){toast("已复制到剪贴板")};
  var fail=function(){toast("复制失败，请手动选择复制")};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,fail);return;
  }
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");done()}catch(e){fail()}
  document.body.removeChild(ta);
}
function statLine(cat){
  var st=stylesOfCat(cat.id);var p=0,sc=0,b=0;
  st.forEach(function(s){if(s.type==="portrait")p++;else if(s.type==="scene")sc++;else b++});
  var parts=[];
  if(p)parts.push(p+" 人像");if(sc)parts.push(sc+" 场景");if(b)parts.push(b+" 人景一体");
  return cat.count+" 种风格 · "+parts.join(" · ");
}

    '<div class="breadcrumb"><a href="#/">首页</a><span>/</span><a href="#/cat/'+c.id+'">'+c.name+'</a><span>/</span><span>'+s.name+'</span></div>'+
    '<div class="detail-grid">'+
      '<div class="detail-img-wrap"><img class="detail-img" src="'+s.img+'" alt="'+esc(s.name)+' 参考图"><div class="detail-img-cap">默认参考图 · '+TYPE_NAMES[s.type]+'</div></div>'+
      '<div>'+
        '<div class="detail-head"><div class="tags"><span>'+c.name+'</span><span>'+TYPE_NAMES[s.type]+'</span>'+s.tags.map(function(t){return "<span>"+esc(t)+"</span>"}).join("")+'</div>'+
        '<h1>'+s.name+'</h1><p class="detail-desc">'+s.desc+'</p></div>'+
        '<div class="prompt-block"><div class="p-head"><div class="p-title"><span class="dot"></span>通用提示词模板（可替换主体）</div><button class="copy-btn" data-action="copy" data-copy="tpl" data-id="'+s.id+'" type="button">'+ICO_COPY+'复制</button></div>'+
        '<div class="p-text">'+esc(s.tpl).replace(/【主体描述】/g,'<span class="ph">【主体描述】</span>')+'</div></div>'+
        '<div class="prompt-block"><div class="p-head"><div class="p-title"><span class="dot"></span>完整示例（正向提示词）</div><button class="copy-btn" data-action="copy" data-copy="pos" data-id="'+s.id+'" type="button">'+ICO_COPY+'复制</button></div>'+
        '<div class="p-text">'+esc(s.pos)+'</div></div>'+
        '<div class="prompt-block"><div class="p-head"><div class="p-title"><span class="dot" style="background:var(--sage)"></span>反向提示词（规避翻车）</div><button class="copy-btn" data-action="copy" data-copy="neg" data-id="'+s.id+'" type="button">'+ICO_COPY+'复制</button></div>'+
        '<div class="p-text">'+esc(s.neg)+'</div></div>'+
        '<div class="detail-actions"><a class="btn btn-sage" href="#/studio/'+s.id+'">用此风格试我的图</a><a class="btn btn-ghost" href="#/cat/'+c.id+'">返回分类</a></div>'+
      '</div>'+
    '</div>'+
    '<h3 class="related-title">同类别其他风格</h3>'+
    '<div class="related-scroll">'+rel.map(function(x){
      return '<a class="rel-card" href="#/style/'+x.id+'"><img src="'+x.img+'" alt="'+esc(x.name)+'" loading="lazy"><div class="rel-name">'+esc(x.name)+'</div><div class="rel-type">'+TYPE_NAMES[x.type]+'</div></a>';
    }).join("")+'</div>'+
    '</div></section>';
}
function renderStudio(presetId){
  STUDIO.mode=presetId?"single":"all";STUDIO.styleId=presetId||null;
  var opts='';
  CATS.forEach(function(c){
    opts+='<optgroup label="'+c.name+'">';
    stylesOfCat(c.id).forEach(function(s){opts+='<option value="'+s.id+'"'+(presetId===s.id?" selected":"")+'>'+s.name+'</option>'});
    opts+='</optgroup>';
  });
  $('#app').innerHTML=
    '<section class="page"><div class="container studio-wrap">'+
    '<div class="breadcrumb"><a href="#/">首页</a><span>/</span><span>上传工作台</span></div>'+
    '<p class="eyebrow">风格试衣间</p><h1 class="display" style="font-size:30px;margin-bottom:8px">上传图片 · 预览风格效果</h1>'+
    '<p style="color:var(--ink-2);font-size:14px;margin-bottom:24px;max-width:760px">上传一张图片后，选择“单个风格自定义”或“全部 38 种风格”，系统会把对应风格的通用提示词替换为你图片的主体描述，并实时生成该风格的演示图。</p>'+
    '<div class="drop-zone" id="dropZone">'+
      '<div class="dz-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7 9m5-5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>'+
      '<p>点击选择或拖拽图片到此处</p><small>支持 JPG / PNG / WebP，建议人物或场景类图片效果更直观</small>'+
      '<input type="file" id="fileInput" accept="image/*">'+
    '</div>'+
    '<div id="previewRow" class="preview-row" style="display:none"></div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>生成模式</label><div class="mode-options">'+
        '<label class="mode-opt'+(presetId?" on":"")+'" id="modeSingle"><input type="radio" name="mode" value="single"'+(presetId?" checked":"")+'>'+
          '<span><b>单个风格自定义</b><small>选一款风格，单独生成演示图与提示词</small></span></label>'+
        '<label class="mode-opt'+(presetId?"":" on")+'" id="modeAll"><input type="radio" name="mode" value="all"'+(presetId?"":" checked")+'>'+
          '<span><b>全部 38 种风格</b><small>一键批量生成所有风格的演示图与提示词</small></span></label>'+
      '</div><div class="hint" id="modeHint">'+(presetId?"已按所选风格进入单风格模式，可切换":"选择“全部”会生成 38 张演示图，稍等片刻即可")+'</div></div>'+
      '<div class="field"><label>选择风格</label><select class="style-select" id="styleSelect">'+opts+'</select>'+
      '<div class="hint">仅“单个风格自定义”模式下生效；也可先在风格详情页点“用此风格试我的图”直达</div></div>'+
      '<div class="field" style="grid-column:1/-1"><label>图片主体描述（可选）</label>'+
      '<textarea class="subject" id="subjectInput" placeholder="例如：一只橘猫趴在窗台上、穿着风衣的年轻男生、清晨的古镇小巷…"></textarea>'+
      '<div class="hint">留空时使用“你上传的图片主体”作为占位；填写后会替换进每款风格的【主体描述】位置</div></div>'+
    '</div>'+
    '<button class="btn btn-primary studio-run" id="runBtn" type="button">生成风格演示图</button>'+
    '<div class="studio-note">说明：演示图为浏览器端实时风格模拟（滤镜 + 画布处理），用于直观比较各风格适配度；正式出图请复制对应提示词，到豆包、即梦等 AI 绘图工具中生成。</div>'+
    '<div id="resultArea"></div>'+
    '</div></section>';
  bindStudio(presetId);
}

/* ============ 上传工作台逻辑 ============ */
var STUDIO={img:null,mode:"all",styleId:null,subject:"",results:{}};
function bindStudio(presetId){
  var dz=$("#dropZone"),fi=$("#fileInput"),pv=$("#previewRow");
  dz.addEventListener("click",function(){fi.click()});
  dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("drag")});
  dz.addEventListener("dragleave",function(){dz.classList.remove("drag")});
  dz.addEventListener("drop",function(e){e.preventDefault();dz.classList.remove("drag");var f=e.dataTransfer.files[0];if(f&&f.type.indexOf("image")===0)loadFile(f)});
  fi.addEventListener("change",function(){if(fi.files&&fi.files[0]){loadFile(fi.files[0]);fi.value=""}});
  function loadFile(f){
    var r=new FileReader();
    r.onload=function(){STUDIO.img=new Image();STUDIO.img.onload=function(){
      pv.style.display="flex";
      pv.innerHTML='<div class="preview-box"><img src="'+r.result+'" alt="原图预览"><button class="del" data-action="clearimg" type="button">×</button><div style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:6px">原图 · '+STUDIO.img.naturalWidth+'×'+STUDIO.img.naturalHeight+'</div></div>';
      toast("图片已载入，选择模式后生成");
    };STUDIO.img.src=r.result};
    r.readAsDataURL(f);
  }
  $$(".mode-opt").forEach(function(el){
    el.addEventListener("click",function(){
      $$(".mode-opt").forEach(function(x){x.classList.remove("on")});
      el.classList.add("on");
      var inp=el.querySelector("input");inp.checked=true;STUDIO.mode=inp.value;
      $("#modeHint").textContent=inp.value==="all"?"选择“全部”会生成 38 张演示图，稍等片刻即可":"已按所选风格进入单风格模式，可切换";
      if(inp.value==="single")$("#styleSelect").value=STUDIO.styleId||$("#styleSelect").value;
    });
  });
  $("#styleSelect").addEventListener("change",function(){STUDIO.styleId=this.value});
  $("#subjectInput").addEventListener("input",function(){STUDIO.subject=this.value});
  $("#runBtn").addEventListener("click",runStudio);
}
function runStudio(){
  if(!STUDIO.img){toast("请先上传一张图片");return}
  var mask=$("#loadingMask");mask.classList.add("show");
  setTimeout(function(){
    var subject=(STUDIO.subject&&STUDIO.subject.trim())||"你上传的图片主体";
    var ids=STUDIO.mode==="all"?STYLES.map(function(s){return s.id}):[STUDIO.styleId||$("#styleSelect").value];
    var out="";
    ids.forEach(function(id){
      var s=styleOf(id);if(!s)return;
      var adapted=s.tpl.replace(/【主体描述】/g,subject);
      STUDIO.results[id]=adapted;
      var dataURL=renderFX(s,subject);
      out+='<div class="result-card" data-id="'+id+'">'+
        (dataURL?'<img src="'+dataURL+'" alt="'+esc(s.name)+' 风格演示图" style="width:100%;aspect-ratio:3/4;object-fit:cover">':'<canvas></canvas>')+
        '<div class="r-body"><h4>'+esc(s.name)+'</h4><span class="r-type">'+TYPE_NAMES[s.type]+' · '+catOf(s.cat).name+'</span>'+
        '<div class="r-prompt" title="点击展开">'+esc(adapted)+'</div>'+
        '<div class="r-actions"><button class="mini-btn solid" data-action="copy" data-copy="adapted" data-id="'+id+'" type="button">'+ICO_COPY+'复制提示词</button>'+
        (dataURL?'<button class="mini-btn" data-action="dl" data-id="'+id+'" type="button">'+ICO_DL+'下载</button>':'')+
        '</div></div></div>';
    });
    var head='<div class="result-head"><h3>演示图（'+ids.length+' 款风格）</h3><small>演示图为实时风格模拟 · 提示词已替换为你上传图片的主体描述</small></div>';
    if(ids.length>1)head='<div class="result-head"><h3>演示图（'+ids.length+' 款风格）</h3><div style="display:flex;gap:10px;align-items:center"><button class="copy-btn" data-action="copyAll" type="button">'+ICO_COPY+'复制全部提示词</button><small>演示图为实时风格模拟</small></div></div>';
    $("#resultArea").innerHTML=head+'<div class="result-grid">'+out+'</div>';
    $$("#resultArea .r-prompt").forEach(function(el){
      el.addEventListener("click",function(){el.classList.toggle("more")});
    });
    mask.classList.remove("show");
    $("#resultArea").scrollIntoView({behavior:"smooth",block:"start"});
  },60);
}
function renderFX(s,subject){
  try{
    var fx=FX[s.fx]||FX.filmWarm;
    var img=STUDIO.img;
    var maxW=900;var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
    var c=document.createElement("canvas");c.width=w;c.height=h;
    var ctx=c.getContext("2d");
    var css=(fx.blur?"blur("+fx.blur+"px) ":"")+fx.css;
    ctx.filter=css;
    ctx.drawImage(img,0,0,w,h);
    ctx.filter="none";
    var d=ctx.getImageData(0,0,w,h),pix=d.data;
    if(fx.post){var lvl=fx.post,step=255/(lvl-1);for(var i=0;i<pix.length;i+=4){pix[i]=Math.round(pix[i]/step)*step;pix[i+1]=Math.round(pix[i+1]/step)*step;pix[i+2]=Math.round(pix[i+2]/step)*step}}
    if(fx.shift){var off=fx.shift;for(var j=0;j<pix.length;j+=4){var r=pix[j];pix[j]=pix[(j+off*4)%pix.length]||r}}
    ctx.putImageData(d,0,0);
    if(fx.tint){ctx.globalCompositeOperation="source-atop";ctx.fillStyle="rgba("+fx.tint[0]*255+","+fx.tint[1]*255+","+fx.tint[2]*255+","+fx.tint[3]+")";ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation="source-over"}
    if(fx.vig){var g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.42,w/2,h/2,Math.max(w,h)*0.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+fx.vig+")");ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
    if(fx.grain){for(var k=0;k<Math.min(9000,w*h/220);k++){var gx=Math.random()*w,gy=Math.random()*h;ctx.fillStyle=Math.random()>0.5?"rgba(0,0,0,"+(Math.random()*0.05+0.02)+")":"rgba(255,255,255,"+(Math.random()*0.05+0.02)+")";ctx.fillRect(gx,gy,1.5,1.5)}}
    return c.toDataURL("image/jpeg",0.88);
  }catch(e){return null}
}

/* ============ 全局事件（事件委托） ============ */
var STAT={home:{cat:"all",type:"all",kw:""}};
function clearimg(){STUDIO.img=null;$("#previewRow").style.display="none";$("#previewRow").innerHTML="";toast("已移除图片，可重新上传")}
document.getElementById("app").addEventListener("click",function(e){
  var el=e.target.closest("[data-action],[data-filter],[href^='#/']");
  if(!el)return;
  if(el.hasAttribute("data-nav")){return}
  var action=el.dataset.action;
  if(action==="copy"){
    var s=styleOf(el.dataset.id);if(!s)return;
    var map={pos:s.pos,neg:s.neg,tpl:s.tpl,adapted:(STUDIO.results[el.dataset.id]||s.tpl)};
    copyText(map[el.dataset.copy]||s.pos);return;
  }
  if(action==="copyAll"){
    var txt=STYLES.map(function(s){return "【"+s.name+"】\n"+(STUDIO.results[s.id]||s.tpl)}).join("\n\n");
    copyText(txt);return;
  }
  if(action==="dl"){
    var card=$('.result-card[data-id="'+el.dataset.id+'"]');if(!card)return;
    var img=card.querySelector("img");if(!img)return;
    var a=document.createElement("a");a.href=img.src;a.download=el.dataset.id+"-style-demo.jpg";document.body.appendChild(a);a.click();document.body.removeChild(a);toast("已开始下载");return;
  }
  if(action==="clearimg"){clearimg();return}
  var f=el.dataset.filter;
  if(f){
    if(f==="all"){STAT.home={cat:"all",type:"all",kw:STAT.home.kw}}
    else if(f.indexOf("cat:")===0){STAT.home.cat=f.slice(4);STAT.home.type="all"}
    else if(f.indexOf("type:")===0){STAT.home.type=f.slice(5);STAT.home.cat="all"}
    refreshGalleryTools();window.scrollTo(0,$(".gallery-tools").offsetTop-90);return;
  }
});

/* ============ 路由 ============ */
function route(){
  var h=location.hash.replace(/^#\/?/,"");
  var parts=h.split("/").filter(Boolean);
  if(!parts.length){renderHome();return}
  if(parts[0]==="cat"){renderCat(parts[1]);return}
  if(parts[0]==="style"){renderStyle(parts[1]);return}
  if(parts[0]==="studio"){renderStudio(parts[1]||null);return}
  if(parts[0]==="gallery"){renderHome();setTimeout(function(){var g=$(".gallery-tools");if(g)g.scrollIntoView({behavior:"smooth"})},80);return}
  renderHome();
}
window.addEventListener("hashchange",function(){route();window.scrollTo(0,0)});

/* ============ 导航装配 ============ */
function buildNav(){
  var dd=$("#ddMenu");
  dd.innerHTML=CATS.map(function(c){return '<a class="dd-item" href="#/cat/'+c.id+'" data-nav>'+c.name+'<small>'+c.count+' 种风格</small></a>'}).join("");
  var mm=$("#mobileMenu");
  mm.innerHTML='<a class="mm-link" href="#/" data-nav>首页</a>'+CATS.map(function(c){return '<a class="mm-link" href="#/cat/'+c.id+'" data-nav>'+c.name+'</a>'}).join("")+'<a class="mm-link" href="#/studio" data-nav>上传工作台</a>';
  $("#footCats").innerHTML=CATS.map(function(c){return '<a href="#/cat/'+c.id+'" data-nav>'+c.name+'</a>'}).join("");
  var ddBtn=$("#ddBtn"),ddCat=$("#ddCat");
  ddBtn.addEventListener("click",function(e){e.stopPropagation();ddCat.classList.toggle("open")});
  document.addEventListener("click",function(){ddCat.classList.remove("open")});
  $("#burger").addEventListener("click",function(){this.classList.toggle("open");$("#mobileMenu").classList.toggle("open")});
}
buildNav();
route();
</script>
