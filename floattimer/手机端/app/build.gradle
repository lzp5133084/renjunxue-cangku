plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 正式签名配置：证书与密码保存在本地 keystore.properties（不随源码公开）
// 文件缺失时自动退化为 debug 签名，保证任何人拉取源码都能正常编译
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.junge.floattimer'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.junge.floattimer"
        // 兼容安卓 5.0 起的老设备（手表 / 电视盒子 / 低配手机），与旗舰产品「鼠标画笔」一致
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.0.8"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

