<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSun Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #090b10;
            --surface: rgba(17, 24, 39, 0.75);
            --surface-solid: #111827;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 顶栏 ===== */
        .toolbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .brand-logo {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }
        .toolbar-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-hover), #a78bfa); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239,68,68,0.3); color: #f87171; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ===== 主区域 ===== */
        .main {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .screen-wrap {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
            background: #000;
        }
        #screen {
            display: block;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 160px);
            cursor: crosshair;
            image-rendering: auto;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px;
        }
        .empty-icon {
            width: 100px; height: 100px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
            display: flex; align-items: center; justify-content: center;
            font-size: 44px;
        }
        .empty-state h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .empty-state p { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

        /* ===== 连接对话框 ===== */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .modal .sub { color: var(--text-2); font-size: 13px; margin-bottom: 24px; }
        .form-item { margin-bottom: 16px; }
        .form-item label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
        .form-item input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-item input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-actions .btn { flex: 1; justify-content: center; padding: 11px; }

        /* ===== 状态栏 ===== */
        .statusbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 24px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--text-2);
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-green { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot-red { background: var(--danger); }
        .status-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* 文件管理侧面板 */
        .file-panel {
            position: fixed;
            top: 63px; right: -420px;
            width: 400px; height: calc(100vh - 63px);
            background: var(--surface-solid);
            border-left: 1px solid var(--border);
            box-shadow: -20px 0 60px rgba(0,0,0,0.5);
            z-index: 90;
            display: flex;
            flex-direction: column;
            transition: right 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .file-panel.open { right: 0; }
        .file-panel-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }
        .file-path-bar { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
        .file-path-bar input {
            flex: 1; padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
        }
        .file-path-bar input:focus { border-color: var(--accent); }
        .file-list { flex: 1; overflow-y: auto; padding: 8px; }
        .file-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 8px;
            cursor: pointer; font-size: 13.5px;
            transition: background 0.15s;
        }
        .file-item:hover { background: rgba(255,255,255,0.06); }
        .file-item .fi-icon { width: 20px; text-align: center; flex-shrink: 0; }
        .file-item .fi-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item .fi-meta { color: var(--text-2); font-size: 11.5px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .file-empty { color: var(--text-2); font-size: 13px; text-align: center; padding: 40px 20px; }
        .file-err { color: #f87171; font-size: 13px; text-align: center; padding: 24px 20px; }

        /* 全屏模式 */
        .fullscreen .toolbar, .fullscreen .statusbar { display: none; }
        .fullscreen .main { padding: 0; }
        #screen.fs { max-width: 100vw; max-height: 100vh; }

        /* ===== 移动端适配（≤ 768px） ===== */
        @media (max-width: 768px) {
            .toolbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
            .brand { font-size: 15px; gap: 8px; }
            .brand-logo { width: 28px; height: 28px; font-size: 13px; }
            .brand span:last-of-type { display: none; }
            .toolbar-actions { flex-wrap: wrap; gap: 6px; }
            .btn { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; gap: 4px; }
            .btn span { display: none; }   /* 隐藏中文标签，只留图标 */
            .btn.btn-primary span, .btn.btn-danger span { display: inline; }

            .main { padding: 10px; }
            .screen-wrap { border-radius: 10px; }
            #screen {
                max-width: 100%;
                max-height: calc(100vh - 240px);
                touch-action: none;       /* 禁止浏览器默认触摸行为 */
            }

            .modal { width: calc(100vw - 32px); padding: 22px; border-radius: 14px; }

            .statusbar { flex-wrap: wrap; gap: 10px 16px; padding: 8px 12px; font-size: 11.5px; }
            .status-item { gap: 4px; }

            .file-panel {
                top: 0; right: -100vw;
                width: 100vw; height: 100vh;
                border-left: none;
            }
            .file-panel.open { right: 0; }
            .file-panel-head { padding: 14px 16px; }
            .file-item { padding: 12px 14px; font-size: 14px; }
            .file-path-bar { padding: 10px 14px; }

            /* 底部操作条（触屏控制） */
            .touch-bar {
                position: fixed; left: 0; right: 0; bottom: 0;
                z-index: 20;
                display: flex; align-items: center; justify-content: space-around;
                padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
                background: rgba(17,24,39,0.92);
                backdrop-filter: blur(20px);
                border-top: 1px solid var(--border);
                transform: translateY(100%);
                transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
            }
            body.mobile-connected .touch-bar { transform: translateY(0); }
            .touch-bar button {
                padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
                background: rgba(255,255,255,0.05); color: var(--text);
                font-size: 22px; min-width: 48px; min-height: 48px;
                display: flex; align-items: center; justify-content: center;
            }
            .touch-bar button:active { background: rgba(99,102,241,0.3); }
            .touch-hint {
                position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
                background: rgba(0,0,0,0.75); color: #fff; padding: 8px 16px;
                border-radius: 20px; font-size: 13px; z-index: 50;
                pointer-events: none; opacity: 0; transition: opacity 0.3s;
                backdrop-filter: blur(8px);
            }
            .touch-hint.show { opacity: 1; }
        }

        /* 禁止移动端双指缩放整个页面 */
        html { touch-action: manipulation; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="brand">
            <div class="brand-logo">☀</div>
            <span>MiniSun</span>
            <span style="font-size:11px; color:var(--text-2); font-weight:400; margin-left:4px;">个人远控</span>
        </div>
        <div class="toolbar-actions">
            <button class="btn" id="btnClipboard" disabled>📋 剪贴板</button>
            <button class="btn" id="btnFiles" disabled>📁 文件</button>
            <button class="btn btn-primary" id="btnConnect">⚡ 连接设备</button>
            <button class="btn btn-danger" id="btnDisconnect" disabled>断开</button>
            <button class="btn" id="btnFullscreen" disabled>⛶ 全屏</button>
        </div>
    </div>

    <div class="main" id="mainArea">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">🖥️</div>
            <h2>尚未连接设备</h2>
            <p>在目标设备上运行 agent.ps1，然后点击「连接设备」开始远程控制</p>
            <button class="btn btn-primary" onclick="showConnectModal()">立即连接</button>
        </div>
        <div class="screen-wrap" id="screenWrap" style="display:none;">
            <canvas id="screen"></canvas>
        </div>
    </div>

    <div class="statusbar">
        <div class="status-item"><span class="dot dot-red" id="statusDot"></span><span id="statusText">未连接</span></div>
        <div class="status-item">分辨率 <span class="status-val" id="statRes">—</span></div>
        <div class="status-item">帧率 <span class="status-val" id="statFps">—</span> FPS</div>
        <div class="status-item">码率 <span class="status-val" id="statBps">—</span></div>
        <div class="status-item">延迟 <span class="status-val" id="statPing">—</span> ms</div>
    </div>

    <div class="modal-mask" id="connectModal">
        <div class="modal">
            <h3>连接远程设备</h3>
            <div class="sub">输入运行 MiniSun Agent 的设备地址</div>
            <div class="form-item">
                <label>设备 IP 地址</label>
                <input type="text" id="inputHost" placeholder="例如 192.168.1.100" value="127.0.0.1">
            </div>
            <div class="form-item">
                <label>端口</label>
                <input type="number" id="inputPort" placeholder="8080" value="8080">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="hideConnectModal()">取消</button>
                <button class="btn btn-primary" onclick="doConnect()">连接</button>
            </div>
        </div>
    </div>

    <!-- 剪贴板同步面板 -->
    <div class="modal-mask" id="clipModal">
        <div class="modal" style="width:480px;">
            <h3>📋 剪贴板同步</h3>
            <div class="sub">在主控端与被控端之间同步文本剪贴板</div>
            <div class="form-item">
                <label>剪贴板内容</label>
                <textarea id="clipText" rows="7" style="width:100%; padding:11px 14px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:13px; outline:none; resize:vertical; font-family:inherit;" placeholder="点击「获取远端」拉取被控端剪贴板，或在此粘贴文本后「发送到远端」"></textarea>
            </div>
            <div class="modal-actions" style="flex-wrap:wrap;">
                <button class="btn" id="btnClipGet">⬇ 获取远端剪贴板</button>
                <button class="btn" id="btnClipCopy">⧉ 复制到本机</button>
                <button class="btn btn-primary" id="btnClipSend">⬆ 发送到远端</button>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="hideClipModal()" style="flex:1; justify-content:center;">关闭</button>
            </div>
        </div>
    </div>

    <!-- 文件管理侧面板 -->
    <div class="file-panel" id="filePanel">
        <div class="file-panel-head">
            <div style="font-weight:600; font-size:14.5px;">📁 远端文件</div>
            <div style="display:flex; gap:8px;">
                <button class="btn" id="btnFileUpload" style="padding:5px 12px; font-size:12.5px;">⬆ 上传到此目录</button>
                <button class="btn" id="btnFileClose" style="padding:5px 12px; font-size:12.5px;">✕</button>
            </div>
        </div>
        <div class="file-path-bar">
            <input type="text" id="filePathInput" placeholder="远端路径，如 C:\Users" value="C:\">
            <button class="btn btn-primary" id="btnFileGo" style="padding:8px 16px;">浏览</button>
        </div>
        <div class="file-list" id="fileList">
            <div class="file-empty">输入路径后点「浏览」查看远端文件</div>
        </div>
        <input type="file" id="fileInput" multiple style="display:none;">
    </div>

    <!-- 移动端底部触屏操作条 -->
    <div class="touch-bar" id="touchBar">
        <button id="btnTapAlt" title="模拟 Alt">⎇</button>
        <button id="btnTapCtrl" title="模拟 Ctrl">⌃</button>
        <button id="btnTapShift" title="模拟 Shift">⇧</button>
        <button id="btnTapEsc" title="Esc">⎋</button>
        <button id="btnTapEnter" title="Enter">⏎</button>
        <button id="btnTapRight" title="右键/长按">◐</button>
        <button id="btnTapWheelUp" title="滚轮上">↑</button>
        <button id="btnTapWheelDown" title="滚轮下">↓</button>
    </div>
    <div class="touch-hint" id="touchHint"></div>

    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        let ws = null;
        let connected = false;
        let screenW = 0, screenH = 0;
        let frameCount = 0, byteCount = 0, lastStatTime = Date.now();
        let lastFrameTime = Date.now();
        let currentDir = 'C:\\';
        let dlCtx = null;
        let uploading = false;

        const $ = id => document.getElementById(id);

        function showConnectModal() { $('connectModal').classList.add('show'); }
        function hideConnectModal() { $('connectModal').classList.remove('show'); }

        $('btnConnect').onclick = showConnectModal;
        $('btnDisconnect').onclick = doDisconnect;
        $('btnFullscreen').onclick = toggleFullscreen;

        function doConnect() {
            const host = $('inputHost').value.trim();
            const port = parseInt($('inputPort').value) || 8080;
            if (!host) { alert('请输入设备 IP'); return; }
            hideConnectModal();

            setStatus('connecting', '连接中...');
            ws = new WebSocket(`ws://${host}:${port}`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                connected = true;
                setStatus('online', '已连接');
                $('emptyState').style.display = 'none';
                $('screenWrap').style.display = 'block';
                $('btnConnect').disabled = true;
                $('btnDisconnect').disabled = false;
                $('btnFullscreen').disabled = false;
                $('btnClipboard').disabled = false;
                $('btnFiles').disabled = false;
                frameCount = 0; byteCount = 0; lastStatTime = Date.now();
                if (isMobile) document.body.classList.add('mobile-connected');
            };
            ws.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    try { handleMsg(JSON.parse(e.data)); } catch {}
                } else {
                    byteCount += e.data.byteLength;
                    frameCount++;
                    lastFrameTime = Date.now();
                    const blob = new Blob([e.data], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0);
                        URL.revokeObjectURL(url);
                    };
                    img.src = url;
                }
            };
            ws.onclose = () => { onClosed(); };
            ws.onerror = () => { onClosed(); };
        }

        function handleMsg(msg) {
            switch (msg.type) {
                case 'screen':
                    screenW = msg.width; screenH = msg.height;
                    canvas.width = screenW; canvas.height = screenH;
                    $('statRes').textContent = `${screenW} × ${screenH}`;
                    break;
                case 'clip_text':
                    $('clipText').value = msg.text || '';
                    $('btnClipGet').textContent = '⬇ 获取远端剪贴板';
                    break;
                case 'clip_ok':
                    toast(msg.ok ? '已写入远端剪贴板' : '写入远端剪贴板失败：' + (msg.err || ''));
                    break;
                case 'file_list':
                    currentDir = msg.path || currentDir;
                    $('filePathInput').value = currentDir;
                    renderFileList(msg.items || []);
                    break;
                case 'file_begin':
                    dlCtx = { name: msg.name, total: msg.total, parts: new Array(msg.total), got: 0 };
                    break;
                case 'file_chunk':
                    if (dlCtx) { dlCtx.parts[msg.idx] = msg.data; dlCtx.got++; }
                    break;
                case 'file_end':
                    if (dlCtx) finishDownload();
                    break;
                case 'file_done':
                    toast('已上传到远端：' + msg.path);
                    if ($('filePanel').classList.contains('open')) browseDir(currentDir);
                    break;
                case 'file_err':
                    toast('文件操作失败：' + (msg.err || ''));
                    break;
            }
        }

        function toast(text) {
            const t = document.getElementById('toast') || (() => {
                const el = document.createElement('div');
                el.id = 'toast';
                el.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); background:rgba(17,24,39,0.92); border:1px solid var(--border); color:var(--text); padding:10px 20px; border-radius:10px; font-size:13px; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,0.4); backdrop-filter:blur(10px); transition:opacity 0.3s; opacity:0; pointer-events:none;';
                document.body.appendChild(el);
                return el;
            })();
            t.textContent = text;
            t.style.opacity = '1';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2600);
        }

        function doDisconnect() { if (ws) ws.close(); }

        function onClosed() {
            if (!connected) { setStatus('offline', '连接失败'); return; }
            connected = false;
            setStatus('offline', '未连接');
            $('emptyState').style.display = 'block';
            $('screenWrap').style.display = 'none';
            $('btnConnect').disabled = false;
            $('btnDisconnect').disabled = true;
            $('btnFullscreen').disabled = true;
            $('btnClipboard').disabled = true;
            $('btnFiles').disabled = true;
            $('filePanel').classList.remove('open');
            hideClipModal();
            document.body.classList.remove('fullscreen', 'mobile-connected');
            $('statRes').textContent = '—'; $('statFps').textContent = '—';
            $('statBps').textContent = '—'; $('statPing').textContent = '—';
        }

        function setStatus(state, text) {
            const dot = $('statusDot');
            dot.className = 'dot ' + (state === 'online' ? 'dot-green' : 'dot-red');
            $('statusText').textContent = text;
        }

        // 统计
        setInterval(() => {
            if (!connected) return;
            const now = Date.now();
            const dt = (now - lastStatTime) / 1000;
            if (dt >= 1) {
                $('statFps').textContent = (frameCount / dt).toFixed(1);
                const kbps = (byteCount * 8 / dt / 1024);
                $('statBps').textContent = kbps > 1024 ? (kbps/1024).toFixed(1) + ' Mbps' : kbps.toFixed(0) + ' Kbps';
                $('statPing').textContent = Math.min(999, now - lastFrameTime);
                frameCount = 0; byteCount = 0; lastStatTime = now;
            }
        }, 500);

        // ===== 输入转发 =====
        function send(obj) { if (ws && connected && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

        function getCanvasPos(e) {
            const r = canvas.getBoundingClientRect();
            return {
                x: Math.round((e.clientX - r.left) / r.width * screenW),
                y: Math.round((e.clientY - r.top) / r.height * screenH)
            };
        }

        const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };

        canvas.addEventListener('mousemove', e => { const p = getCanvasPos(e); send({ type: 'mousemove', ...p }); });
        canvas.addEventListener('mousedown', e => { e.preventDefault(); send({ type: 'mousedown', button: btnMap[e.button] || 'left' }); });
        canvas.addEventListener('mouseup', e => { e.preventDefault(); send({ type: 'mouseup', button: btnMap[e.button] || 'left' }); });
        canvas.addEventListener('wheel', e => { e.preventDefault(); send({ type: 'wheel', delta: e.deltaY > 0 ? -120 : 120 }); }, { passive: false });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // ===== 移动端检测 =====
        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.matchMedia('(max-width: 768px)').matches;

        // ===== 触屏事件映射 =====
        const touchState = { singleTouch: null, longPressTimer: null, wasLongPress: false, pinchDist: 0 };

        function touchPos(t, r) {
            return {
                x: Math.round((t.clientX - r.left) / r.width * screenW),
                y: Math.round((t.clientY - r.top) / r.height * screenH)
            };
        }

        function longPressStart() {
            touchState.longPressTimer = setTimeout(() => {
                if (touchState.singleTouch) {
                    const p = touchState.singleTouch._pos;
                    send({ type: 'mousedown', button: 'right', ...p });
                    send({ type: 'mouseup',   button: 'right', ...p });
                    touchState.wasLongPress = true;
                    showTouchHint('右键');
                }
            }, 450);
        }
        function longPressCancel() {
            if (touchState.longPressTimer) { clearTimeout(touchState.longPressTimer); touchState.longPressTimer = null; }
        }
        function showTouchHint(text) {
            const h = $('touchHint');
            h.textContent = text;
            h.classList.add('show');
            clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('show'), 700);
        }

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const r = canvas.getBoundingClientRect();
            if (e.touches.length === 1) {
                const t = e.touches[0];
                const p = touchPos(t, r);
                t._pos = p;
                touchState.singleTouch = t;
                touchState.wasLongPress = false;
                send({ type: 'mousemove', ...p });
                send({ type: 'mousedown', button: 'left', ...p });
                longPressStart();
            } else if (e.touches.length === 2) {
                longPressCancel();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchState.pinchDist = Math.hypot(dx, dy);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const r = canvas.getBoundingClientRect();
            if (e.touches.length === 1) {
                const t = e.touches[0];
                const p = touchPos(t, r);
                t._pos = p;
                touchState.singleTouch = t;
                send({ type: 'mousemove', ...p });
                longPressCancel();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const d = Math.hypot(dx, dy);
                if (touchState.pinchDist > 0) {
                    const delta = touchState.pinchDist - d;
                    if (Math.abs(delta) > 6) {
                        send({ type: 'wheel', delta: delta > 0 ? -120 : 120 });
                        showTouchHint(delta > 0 ? '滚轮↑' : '滚轮↓');
                    }
                }
                touchState.pinchDist = d;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            longPressCancel();
            if (touchState.wasLongPress) { touchState.wasLongPress = false; touchState.singleTouch = null; touchState.pinchDist = 0; return; }
            if (touchState.singleTouch) {
                const p = touchState.singleTouch._pos;
                send({ type: 'mouseup', button: 'left', ...p });
            }
            touchState.singleTouch = null; touchState.pinchDist = 0;
        }, { passive: false });

        canvas.addEventListener('touchcancel', e => {
            longPressCancel();
            if (touchState.singleTouch) {
                const p = touchState.singleTouch._pos;
                send({ type: 'mouseup', button: 'left', ...p });
            }
            touchState.singleTouch = null; touchState.pinchDist = 0; touchState.wasLongPress = false;
        }, { passive: false });

        // 键盘：keyCode → Windows VK 简表
        function toVK(e) {
            if (e.keyCode >= 65 && e.keyCode <= 90) return e.keyCode;      // A-Z
            if (e.keyCode >= 48 && e.keyCode <= 57) return e.keyCode;      // 0-9
            const map = { 8:8, 9:9, 13:13, 16:16, 17:17, 18:18, 27:27, 32:32, 37:37, 38:38, 39:39, 40:40, 46:46, 36:36, 35:35, 33:33, 34:34,
                          112:112,113:113,114:114,115:115,116:116,117:117,118:118,119:119,120:120,121:121,122:122,123:123,
                          91:91, 92:92, 20:20, 144:144, 145:145, 186:186, 187:187, 188:188, 189:189, 190:190, 191:191, 192:192, 219:219, 220:220, 221:221, 222:222 };
            return map[e.keyCode] || e.keyCode;
        }

        // ===== 修饰键状态（移动端触屏条用） =====
        const modState = { ctrl:false, alt:false, shift:false };
        const vkMap = { ctrl:17, alt:18, shift:16 };
        function modToggle(k, btn) {
            modState[k] = !modState[k];
            send({ type: modState[k] ? 'keydown' : 'keyup', key: vkMap[k] });
            btn.style.background = modState[k] ? 'rgba(99,102,241,0.5)' : '';
        }
        function sendKeyPress(vk) { send({ type:'keydown', key:vk }); send({ type:'keyup', key:vk }); }
        $('btnTapCtrl').onclick = () => modToggle('ctrl', $('btnTapCtrl'));
        $('btnTapAlt').onclick  = () => modToggle('alt',  $('btnTapAlt'));
        $('btnTapShift').onclick= () => modToggle('shift',$('btnTapShift'));
        $('btnTapEsc').onclick  = () => sendKeyPress(27);
        $('btnTapEnter').onclick= () => sendKeyPress(13);
        $('btnTapRight').onclick= () => { const r = canvas.getBoundingClientRect(); const m = screenW/2; send({type:'mousemove',x:Math.round(m),y:Math.round(screenH/2)}); send({type:'mousedown',button:'right'}); send({type:'mouseup',button:'right'}); showTouchHint('右键'); };
        $('btnTapWheelUp').onclick    = () => send({type:'wheel',delta:-240});
        $('btnTapWheelDown').onclick  = () => send({type:'wheel',delta:240});

        document.addEventListener('keydown', e => {
            if (!connected) return;
            if (['F5','F12'].includes(e.key)) return;
            e.preventDefault();
            send({ type: 'keydown', key: toVK(e) });
        });
        document.addEventListener('keyup', e => {
            if (!connected) return;
            e.preventDefault();
            send({ type: 'keyup', key: toVK(e) });
        });

        function toggleFullscreen() {
            const isFs = document.body.classList.toggle('fullscreen');
            canvas.classList.toggle('fs', isFs);
            if (isFs && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        // ===== 剪贴板同步 =====
        function showClipModal() { $('clipModal').classList.add('show'); }
        function hideClipModal() { $('clipModal').classList.remove('show'); }
        $('btnClipboard').onclick = showClipModal;
        $('btnClipGet').onclick = () => {
            $('btnClipGet').textContent = '⏳ 获取中...';
            send({ type: 'clip_get' });
            setTimeout(() => { $('btnClipGet').textContent = '⬇ 获取远端剪贴板'; }, 3000);
        };
        $('btnClipSend').onclick = () => {
            const t = $('clipText').value;
            if (!t) { toast('请先输入要发送的文本'); return; }
            send({ type: 'clip_set', text: t });
        };
        $('btnClipCopy').onclick = async () => {
            const t = $('clipText').value;
            if (!t) { toast('没有可复制的内容'); return; }
            try { await navigator.clipboard.writeText(t); toast('已复制到本机剪贴板'); }
            catch { $('clipText').select(); document.execCommand('copy'); toast('已复制到本机剪贴板'); }
        };

        // ===== 文件管理 =====
        function showFilePanel() {
            $('filePanel').classList.add('open');
            if ($('fileList').dataset.loaded !== '1') browseDir(currentDir);
        }
        $('btnFiles').onclick = showFilePanel;
        $('btnFileClose').onclick = () => $('filePanel').classList.remove('open');
        $('btnFileGo').onclick = () => browseDir($('filePathInput').value.trim() || 'C:\\');
        $('filePathInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnFileGo').click(); });

        function browseDir(path) {
            if (!connected) return;
            $('fileList').innerHTML = '<div class="file-empty">加载中...</div>';
            send({ type: 'file_list', path });
        }

        function fmtSize(n) {
            if (n < 1024) return n + ' B';
            if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
            if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
            return (n / 1073741824).toFixed(2) + ' GB';
        }

        function renderFileList(items) {
            $('fileList').dataset.loaded = '1';
            const box = $('fileList');
            box.innerHTML = '';
            // 上一级目录
            if (currentDir && !/^[A-Za-z]:\\?$/i.test(currentDir)) {
                const up = document.createElement('div');
                up.className = 'file-item';
                up.dataset.dir = '1';
                up.dataset.path = '__UP__';
                up.innerHTML = `<span class="fi-icon">⬆️</span><span class="fi-name">..（上一级）</span>`;
                box.appendChild(up);
            }
            const dirs = items.filter(x => x.isDir).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            const files = items.filter(x => !x.isDir).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            for (const it of [...dirs, ...files]) {
                const row = document.createElement('div');
                row.className = 'file-item';
                row.dataset.dir = it.isDir ? '1' : '0';
                row.dataset.path = currentDir.replace(/\\+$/, '') + '\\' + it.name;
                row.dataset.size = it.size || '0';
                row.innerHTML = `<span class="fi-icon">${it.isDir ? '📁' : '📄'}</span>` +
                    `<span class="fi-name" title="${it.name}">${it.name}</span>` +
                    `<span class="fi-meta">${it.isDir ? '目录' : fmtSize(it.size) + ' · ' + it.mtime}</span>`;
                box.appendChild(row);
            }
            if (!dirs.length && !files.length) {
                box.innerHTML = '<div class="file-empty">此目录为空</div>';
            }
        }

        // 事件委托：文件列表点击（目录进入 / 文件下载）
        $('fileList').addEventListener('click', e => {
            const row = e.target.closest('.file-item');
            if (!row) return;
            if (row.dataset.path === '__UP__') {
                let p = currentDir.replace(/\\+$/, '');
                const i = p.lastIndexOf('\\');
                browseDir(i >= 2 ? p.substring(0, i + 1) : 'C:\\');
                return;
            }
            if (row.dataset.dir === '1') browseDir(row.dataset.path);
            else requestDownload(row.dataset.path, parseInt(row.dataset.size || '0', 10));
        });

        // 下载：远端 → 本机
        function requestDownload(path, size) {
            if (size > 524288000) { toast('文件超过 500MB，暂不支持'); return; }
            toast('开始下载：' + path.split('\\').pop());
            dlCtx = null;
            send({ type: 'file_get', path });
        }

        function finishDownload() {
            const c = dlCtx; dlCtx = null;
            try {
                const bin = atob(c.parts.join(''));
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const blob = new Blob([bytes]);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = c.name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
                toast('下载完成：' + c.name + '（' + fmtSize(bytes.length) + '）');
            } catch (err) {
                toast('下载组装失败：' + err.message);
            }
        }

        // 上传：本机 → 远端
        $('btnFileUpload').onclick = () => $('fileInput').click();
        $('fileInput').onchange = async () => {
            const files = [...$('fileInput').files];
            $('fileInput').value = '';
            for (const f of files) await uploadOne(f);
        };

        async function uploadOne(file) {
            if (uploading) { toast('有文件正在上传，请稍候'); return; }
            if (file.size > 524288000) { toast('文件超过 500MB，暂不支持：' + file.name); return; }
            uploading = true;
            try {
                toast('上传中：' + file.name);
                const buf = new Uint8Array(await file.arrayBuffer());
                const CHUNK = 196608; // 原始字节/片
                const total = Math.max(1, Math.ceil(buf.length / CHUNK));
                send({ type: 'file_put_begin', name: file.name, size: file.size, total });
                for (let i = 0; i < total; i++) {
                    const slice = buf.subarray(i * CHUNK, Math.min((i + 1) * CHUNK, buf.length));
                    let bin = '';
                    for (let j = 0; j < slice.length; j += 8192) bin += String.fromCharCode.apply(null, slice.subarray(j, j + 8192));
                    send({ type: 'file_put_chunk', idx: i, data: btoa(bin) });
                    if (i % 4 === 3) await new Promise(r => setTimeout(r, 0)); // 让出主线程刷新推流
                }
                send({ type: 'file_put_end', dir: currentDir });
            } catch (err) {
                toast('上传失败：' + err.message);
            } finally {
                uploading = false;
            }
        }
    </script>
</body>
</html>
