<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSun Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #090b10;
            --surface: rgba(17, 24, 39, 0.75);
            --surface-solid: #111827;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.06), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 顶栏 ===== */
        .toolbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .brand-logo {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }
        .toolbar-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-hover), #a78bfa); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239,68,68,0.3); color: #f87171; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ===== 主区域 ===== */
        .main {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .screen-wrap {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
            background: #000;
        }
        #screen {
            display: block;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 160px);
            cursor: crosshair;
            image-rendering: auto;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px;
        }
        .empty-icon {
            width: 100px; height: 100px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
            display: flex; align-items: center; justify-content: center;
            font-size: 44px;
        }
        .empty-state h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .empty-state p { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

        /* ===== 连接对话框 ===== */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .modal .sub { color: var(--text-2); font-size: 13px; margin-bottom: 24px; }
        .form-item { margin-bottom: 16px; }
        .form-item label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
        .form-item input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-item input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-actions .btn { flex: 1; justify-content: center; padding: 11px; }

        /* ===== 状态栏 ===== */
        .statusbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 24px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--text-2);
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-green { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot-red { background: var(--danger); }
        .status-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* 全屏模式 */
        .fullscreen .toolbar, .fullscreen .statusbar { display: none; }
        .fullscreen .main { padding: 0; }
        #screen.fs { max-width: 100vw; max-height: 100vh; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="brand">
            <div class="brand-logo">☀</div>
            <span>MiniSun</span>
            <span style="font-size:11px; color:var(--text-2); font-weight:400; margin-left:4px;">个人远控</span>
        </div>
        <div class="toolbar-actions">
            <button class="btn btn-primary" id="btnConnect">⚡ 连接设备</button>
            <button class="btn btn-danger" id="btnDisconnect" disabled>断开</button>
            <button class="btn" id="btnFullscreen" disabled>⛶ 全屏</button>
        </div>
    </div>

    <div class="main" id="mainArea">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">🖥️</div>
            <h2>尚未连接设备</h2>
            <p>在目标设备上运行 agent.ps1，然后点击「连接设备」开始远程控制</p>
            <button class="btn btn-primary" onclick="showConnectModal()">立即连接</button>
        </div>
        <div class="screen-wrap" id="screenWrap" style="display:none;">
            <canvas id="screen"></canvas>
        </div>
    </div>

    <div class="statusbar">
        <div class="status-item"><span class="dot dot-red" id="statusDot"></span><span id="statusText">未连接</span></div>
        <div class="status-item">分辨率 <span class="status-val" id="statRes">—</span></div>
        <div class="status-item">帧率 <span class="status-val" id="statFps">—</span> FPS</div>
        <div class="status-item">码率 <span class="status-val" id="statBps">—</span></div>
        <div class="status-item">延迟 <span class="status-val" id="statPing">—</span> ms</div>
    </div>

    <div class="modal-mask" id="connectModal">
        <div class="modal">
            <h3>连接远程设备</h3>
            <div class="sub">输入运行 MiniSun Agent 的设备地址</div>
            <div class="form-item">
                <label>设备 IP 地址</label>
                <input type="text" id="inputHost" placeholder="例如 192.168.1.100" value="127.0.0.1">
            </div>
            <div class="form-item">
                <label>端口</label>
                <input type="number" id="inputPort" placeholder="8080" value="8080">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="hideConnectModal()">取消</button>
                <button class="btn btn-primary" onclick="doConnect()">连接</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        let ws = null;
        let connected = false;
        let screenW = 0, screenH = 0;
        let frameCount = 0, byteCount = 0, lastStatTime = Date.now();
        let lastFrameTime = Date.now();

        const $ = id => document.getElementById(id);

        function showConnectModal() { $('connectModal').classList.add('show'); }
        function hideConnectModal() { $('connectModal').classList.remove('show'); }

        $('btnConnect').onclick = showConnectModal;
        $('btnDisconnect').onclick = doDisconnect;
        $('btnFullscreen').onclick = toggleFullscreen;

        function doConnect() {
            const host = $('inputHost').value.trim();
            const port = parseInt($('inputPort').value) || 8080;
            if (!host) { alert('请输入设备 IP'); return; }
            hideConnectModal();

            setStatus('connecting', '连接中...');
            ws = new WebSocket(`ws://${host}:${port}`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                connected = true;
                setStatus('online', '已连接');
                $('emptyState').style.display = 'none';
                $('screenWrap').style.display = 'block';
                $('btnConnect').disabled = true;
                $('btnDisconnect').disabled = false;
                $('btnFullscreen').disabled = false;
                frameCount = 0; byteCount = 0; lastStatTime = Date.now();
            };
            ws.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'screen') {
                            screenW = msg.width; screenH = msg.height;
                            canvas.width = screenW; canvas.height = screenH;
                            $('statRes').textContent = `${screenW} × ${screenH}`;
                        }
                    } catch {}
                } else {
                    byteCount += e.data.byteLength;
                    frameCount++;
                    lastFrameTime = Date.now();
                    const blob = new Blob([e.data], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0);
                        URL.revokeObjectURL(url);
                    };
                    img.src = url;
                }
            };
            ws.onclose = () => { onClosed(); };
            ws.onerror = () => { onClosed(); };
        }

        function doDisconnect() { if (ws) ws.close(); }

        function onClosed() {
            if (!connected) { setStatus('offline', '连接失败'); return; }
            connected = false;
            setStatus('offline', '未连接');
            $('emptyState').style.display = 'block';
            $('screenWrap').style.display = 'none';
            $('btnConnect').disabled = false;
            $('btnDisconnect').disabled = true;
            $('btnFullscreen').disabled = true;
            document.body.classList.remove('fullscreen');
            $('statRes').textContent = '—'; $('statFps').textContent = '—';
            $('statBps').textContent = '—'; $('statPing').textContent = '—';
        }

        function setStatus(state, text) {
            const dot = $('statusDot');
            dot.className = 'dot ' + (state === 'online' ? 'dot-green' : 'dot-red');
            $('statusText').textContent = text;
        }

        // 统计
        setInterval(() => {
            if (!connected) return;
            const now = Date.now();
            const dt = (now - lastStatTime) / 1000;
            if (dt >= 1) {
                $('statFps').textContent = (frameCount / dt).toFixed(1);
                const kbps = (byteCount * 8 / dt / 1024);
                $('statBps').textContent = kbps > 1024 ? (kbps/1024).toFixed(1) + ' Mbps' : kbps.toFixed(0) + ' Kbps';
                $('statPing').textContent = Math.min(999, now - lastFrameTime);
                frameCount = 0; byteCount = 0; lastStatTime = now;
            }
        }, 500);

        // ===== 输入转发 =====
        function send(obj) { if (ws && connected && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

        function getCanvasPos(e) {
            const r = canvas.getBoundingClientRect();
            return {
                x: Math.round((e.clientX - r.left) / r.width * screenW),
                y: Math.round((e.clientY - r.top) / r.height * screenH)
            };
        }

        const btnMap = { 0: 'left', 1: 'middle', 2: 'right' };

        canvas.addEventListener('mousemove', e => { const p = getCanvasPos(e); send({ type: 'mousemove', ...p }); });
        canvas.addEventListener('mousedown', e => { e.preventDefault(); send({ type: 'mousedown', button: btnMap[e.button] || 'left' }); });
        canvas.addEventListener('mouseup', e => { e.preventDefault(); send({ type: 'mouseup', button: btnMap[e.button] || 'left' }); });
        canvas.addEventListener('wheel', e => { e.preventDefault(); send({ type: 'wheel', delta: e.deltaY > 0 ? -120 : 120 }); }, { passive: false });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // 键盘：keyCode → Windows VK 简表
        function toVK(e) {
            if (e.keyCode >= 65 && e.keyCode <= 90) return e.keyCode;      // A-Z
            if (e.keyCode >= 48 && e.keyCode <= 57) return e.keyCode;      // 0-9
            const map = { 8:8, 9:9, 13:13, 16:16, 17:17, 18:18, 27:27, 32:32, 37:37, 38:38, 39:39, 40:40, 46:46, 36:36, 35:35, 33:33, 34:34,
                          112:112,113:113,114:114,115:115,116:116,117:117,118:118,119:119,120:120,121:121,122:122,123:123,
                          91:91, 92:92, 20:20, 144:144, 145:145, 186:186, 187:187, 188:188, 189:189, 190:190, 191:191, 192:192, 219:219, 220:220, 221:221, 222:222 };
            return map[e.keyCode] || e.keyCode;
        }

        document.addEventListener('keydown', e => {
            if (!connected) return;
            if (['F5','F12'].includes(e.key)) return;
            e.preventDefault();
            send({ type: 'keydown', key: toVK(e) });
        });
        document.addEventListener('keyup', e => {
            if (!connected) return;
            e.preventDefault();
            send({ type: 'keyup', key: toVK(e) });
        });

        function toggleFullscreen() {
            const isFs = document.body.classList.toggle('fullscreen');
            canvas.classList.toggle('fs', isFs);
            if (isFs && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }
    </script>
</body>
</html>
